services:
  postgres:
    image: postgres:18-alpine
    container_name: jianlai-tech-pg
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: jianlai
      POSTGRES_PASSWORD: jianlai_dev
      POSTGRES_DB: jianlai
    volumes:
      # PG 18 起数据目录是 /var/lib/postgresql/18/docker，卷要挂在父目录
      - jianlai_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianlai -d jianlai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jianlai_pg18:
