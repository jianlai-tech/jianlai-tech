[project]
name = "jianlai-api"
version = "0.1.0"
description = "jianlai-tech API — FastAPI + asyncpg"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "asyncpg>=0.30.0",
  "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
  "ruff>=0.8.3",
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
